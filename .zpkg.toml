[package]
org = "graal-show"
name = "gs-desktop-cli"
version = "0.1.0"
description = "Rust desktop control client for Graal Show"
license = "MIT"
language = "rust"
keywords = ["cli", "desktop", "graal", "rust", "global-tool"]

[package.repository]
vcs = "git"
url = "https://github.com/graal-show/gs-desktop-cli"

[dependencies]
"oresoftware/ores-clis-core" = "^0.1.0"

# Cargo.lock is not committed yet. Promotion remains blocked until a deterministic
# lock is generated and these commands can be switched to --locked.
[build]
command = "cargo build --release --bin gs-desktop"
outputs = ["target/release/gs-desktop"]

[bin]
gs-desktop = "target/release/gs-desktop"

[install]
adapter = "none"
dir = ".vendor/.zed"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -x \"$ZED_PKG_TEST_TARGET/target/release/gs-desktop\" && \"$ZED_PKG_TEST_TARGET/target/release/gs-desktop\" --help >/dev/null"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", ".vendor/.zed/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[scripts]
test = "cargo test --all-targets"
