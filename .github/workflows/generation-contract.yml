name: generation-contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install declared MSRV
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Validate generation lifecycle contract in Rust
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 fmt --all -- --check
          cargo +1.90.0 test --locked --test generation_contract
